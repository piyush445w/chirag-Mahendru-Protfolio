services:
  - type: web
    name: chirag-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEBUG
        value: "0"
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
